---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: showroom-uplift
  namespace: openshift-gitops
spec:
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: showroom-{{ $.Values.guid }}-{{ $.Values.showroom.username }}
  goTemplate: true
  # goTempalteOptions: ["missingkey=error"]
  project: default
  source:
    repoURL: {{ .Values.showroom.repoUrl }}
    targetRevision: {{ .Values.showroom.repoRef }}
    path: charts/showroom-single-pod
    helm:
      values: |
        guid: {{ .Values.guid }} # only passed to terminal for ENV convenience
        deployer:
          domain: {{ .Values.deployer.domain }}
        content:
          contentOnly: {{ .Values.showroom.content.contentOnly }}
          title: UpLift
          repoUrl: {{ .Values.showroom.content.repoUrl }}
          repoRef: {{ .Values.showroom.content.repoRef }}
          user_data: |
            bastion_password: from_helm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
