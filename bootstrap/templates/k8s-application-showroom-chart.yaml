---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: showroom-uplift
  namespace: openshift-gitops
spec:
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: showroom-{{ $.Values.guid }}-{{ $.Values.showroom.username }}
  goTemplate: true
  # goTempalteOptions: ["missingkey=error"]
  project: default
  source:
    repoURL: {{ .Values.showroom.repoUrl }}
    targetRevision: {{ .Values.showroom.repoRef }}
    path: charts/showroom-single-pod
    helm:
      values: |
        guid: {{ .Values.guid }}
        deployer:
          domain: {{ .Values.deployer.domain }}
        content:
          deployer:
            domain: {{ .Values.deployer.domain }}
          contentOnly: "true"
          repoUrl: https://github.com/rhpds/uplift-showroom.git
          repoRef: dev
          user_data: |
            user: gitops_sample_username
            password: gitops_sample_password
            vcenter_console: gitops_sample_vcenter_console
            vcenter_full_user: gitops_sample_vcenter_full_user
            vcenter_password: gitops_sample_vcenter_password
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
